name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: gitleaks を入れる (pre-push のテストに要る)
        if: runner.os == 'macOS'
        run: brew install gitleaks
      - name: 回帰テスト (配布・検証ループ・pre-push・ガード)
        run: bash scripts/test-base.sh
