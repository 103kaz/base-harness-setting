name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Linux だけで流す。macOS のランナーは、非公開にしたときに無料枠を 10 倍の速さで減らすので使わない (macOS は手元で流す)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: gitleaks 8.30.1 を入れる (pre-push のテストに要る。チェックサムを確かめる)
        env:
          ASSET: gitleaks_8.30.1_linux_x64.tar.gz
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o "$RUNNER_TEMP/$ASSET" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$ASSET"
          echo "$SHA256  $RUNNER_TEMP/$ASSET" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/$ASSET" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: 回帰テスト (配布・検証ループ・pre-push・ガード・doctor)
        run: bash scripts/test-base.sh
